# The layers that run each check that is not an int test, read by the harness. A part runs the
# checks of its layers (verification.md, "The report"): quick runs static, render and host, ui
# runs shot and e2e, bench runs bench, cc runs cc. A check a layer reports that is not listed here for that
# layer is an error, and so is a listed check the layer reported no result for. Scenario checks
# take their layers from `layers` in verify/scenarios/<name>.json. In e2e a scenario check gets
# its outcome from its case of flow__every_activity_shows, `flow__every_activity_shows <name>`,
# which writes it to <run>/e2e/scenarios/<name>.json (xtask/src/layers/e2e.rs).

