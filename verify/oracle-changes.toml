[[change]]
id = "p1-mutants-jobs"
reason = "Phase 1's crates diff has about 251 mutants and the mutants part ran them with --jobs=1 (about 4.3 h). Read WT_VERIFY_MUTANTS_JOBS (default 4) and give each parallel test run its own sandbox, rebuild clone and warm target; sort survivors so the message is stable. Proven on the phase 0 canary: the same 6 missed with 1 and 4 jobs. Checks are unchanged."
paths = ["xtask/src/mutants/"]

[[change]]
id = "p1r2-hide-and-show"
reason = "Phase 1 review 1 B1: flow__hide_and_show makes wt1 dirty with an untracked file, which only the 10 s heartbeat shows (W2, W7), but waits about 5 s, so it passes by luck and never tests that showing the tab posts the last document at once (X7). Make a watched git change (a commit) while the tab is hidden and assert the row is current within 2 s of showing."
paths = ["vscode/test/e2e/"]

[[change]]
id = "p1r2-retry-n"
reason = "Phase 1 review 1 B3, with verification.md revision 10: assert the N of 'updates paused, retrying in N s' against retry_at in render, host and flow__connection_states, counting down."
