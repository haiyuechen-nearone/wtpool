# Oracle changes that need the owner's acceptance. An entry's [change.files] table pins each path and key it
# changes at its hash after the change; once accepted, `accept <id> <entry hash>` in verify/accepted.txt.

[[change]]
id = "p0-nested-target"
reason = "lint__no_suppressions, repo_context and isolation skip every folder named target at any depth, so an allow in crates/wt/src/target/mod.rs passes (canary suppress-in-target-module survived). Skip only the repository's own target folder."
paths = ["xtask/src/suppress.rs", "xtask/src/context.rs", "xtask/src/isolation.rs"]

[[change]]
id = "p0-canary-clean-tree"
reason = "The canary runner applies a patch without committing it, so every canary runs on a dirty tree and the clean tree half of version__ can never be tested (canary version-always-dirty survived). Commit the patch in the scratch clone before running."
paths = ["xtask/src/clone.rs"]

[[change]]
id = "p0-cover-stale-binaries"
reason = "cover reuses target/llvm-cov-target, so stale instrumented binaries give false uncovered lines (a clean checkout of the wt --version commit gave FAIL after a canary run). Clean it before unit. Also list changed files that no lcov file names, and measure build scripts."
paths = ["xtask/src/parts.rs", "xtask/src/cover.rs"]

[[change]]
id = "p0-version-dirty-marker"
reason = "version__ decides dirty with contains(\"dirty\") on the whole output. Check the marker on the commit line only."
paths = ["xtask/tests/int.rs"]

[[change]]
id = "p0-isolation-scope"
reason = "isolation fails on any new worktree in the real pool or any new ~/.vscode/extensions folder, which the owner's own work or an extension update can cause. Fail only on ones the run created."
paths = ["xtask/src/isolation.rs"]

[[change]]
id = "p0-test-helpers"
reason = "must_head ignores a git failure, so an empty head passes vacuously. One trace test name does not match its assertion."
paths = ["xtask/tests/support/mod.rs", "xtask/src/trace.rs"]

[[change]]
id = "p0-stop-canary"
reason = "Replace canary stop-frozen-check with the verifier's stop-frozen-check-accepted, which shows trace_complete catches a stopped check on its own."
paths = ["verify/canaries/phase-0/"]

[[change]]
id = "p0r2-stale-commit"
reason = "version__ builds wt once, so it cannot see a commit that goes stale on a rebuild (canary version-stale-commit survived: with rerun-if-changed limited to build.rs, wt --version kept the old commit after a new commit). In int, build in a clone, add an empty wt-verify commit, rebuild with the same target folder and assert the new commit."
paths = ["xtask/tests/int.rs", "xtask/src/parts.rs"]

[[change]]
id = "p0r2-own-output-dirs"
reason = "repo_context skips root node_modules but not vscode/test/node_modules, which the clone keeps. From phase 1 an npm package shipping AGENTS.md or CLAUDE.md would fail a correct build. Also close the isolation gap for a worktree the run adds to the real pool outside the run folder at one of the owner's commits."
paths = ["xtask/src/context.rs", "xtask/src/isolation.rs"]

[[change]]
id = "p0r3-release-version"
reason = "version__ checks only debug builds, so a release build that prints `commit unknown` passes (canary version-release-drops-commit survived). Also run the release binary's --version and assert the full commit and the dirty marker."
paths = ["xtask/tests/int.rs"]

[[change]]
id = "p0r3-isolation-identity"
reason = "The HEAD move check relies on EMAIL, but tests that clear the environment write reflog entries under the machine's default identity, so a run that moves a real pool HEAD or adds a worktree passes (canaries isolation-move-pool-head and isolation-add-pool-worktree survived). Fail on any new HEAD reflog entry in the real pool whose identity is not the owner's configured git address."
paths = ["xtask/src/isolation.rs", "xtask/src/parts.rs", "xtask/tests/support/mod.rs"]

[[change]]
id = "p0r3-rebuild-edit"
status = "deferred: non blocking"
reason = "The rebuild steps edit README.md, a product file, so moving the README breaks verify. Edit a tracked oracle file in the rebuild clone instead."
paths = ["xtask/src/parts.rs"]

[[change]]
id = "p0r4-release-rebuild"
reason = "The release binary is built once, so a release build that keeps an old commit after the next commit passes (canary version-release-stale-commit survived). Run the four rebuild steps for --release too and assert commit and dirty marker at each."
paths = ["xtask/src/parts.rs", "xtask/tests/int.rs"]

[[change]]
id = "p0r4-worktree-removed"
reason = "isolation never compares worktrees before and after a part, so a run that removes or moves a real pool worktree passes (canary isolation-remove-pool-worktree survived). Fail when a worktree present before the part is missing after it."
paths = ["xtask/src/isolation.rs"]

[[change]]
id = "p0r4-identity-scope"
status = "accepted"
reason = "The HEAD reflog rule fails a run when the owner's own agents commit in the real pool under a throwaway identity (seen: t <t@t>, sim <s@s>). Fail only on verify@wt.invalid and git's fallback identity, the identities a run can produce. Also owner_email reads only the global config."
paths = ["xtask/src/isolation.rs"]

[[change]]
id = "p0r5-worktree-folder-deleted"
reason = "isolation records only worktree paths, so a run that deletes a pool worktree's folder (git keeps it listed as prunable) passes (canary isolation-delete-pool-worktree-folder survived). Record whether each folder exists and fail when it disappears. Also rename the test helper pool to must_pool."
paths = ["xtask/src/isolation.rs"]

[[change]]
id = "p0r5-worktree-list-failure"
status = "deferred: non blocking"
reason = "A failed git worktree list becomes an empty list; fail on it instead. fallback_email sets GIT_CONFIG_NOSYSTEM though a cleared environment reads the system config."
paths = ["xtask/src/isolation.rs"]

[[change]]
id = "p0r6-listing-names-run"
reason = "isolation looks for the run folder only in worktree paths, so a run that locks a pool worktree with a reason naming its sandbox passes (canary isolation-lock-pool-worktree-naming-run survived). Apply mentions to the whole porcelain listing after each part."
paths = ["xtask/src/isolation.rs"]

[[change]]
id = "p0r6-unit-tmpdir"
status = "deferred: non blocking"
reason = "The unit layer gives the builder's tests the real TMPDIR, though verification.md gives wt a TMPDIR in the run folder."
paths = ["xtask/src/parts.rs"]

[[change]]
id = "p0r7-suppress-parser"
reason = "lint__no_suppressions does not skip comments or strings, so a lone #[ in a comment or string swallows the code after it and a later #[allow(...)] is never scanned. Scan on from the next character after each attribute and add comment and string cases."
paths = ["xtask/src/suppress.rs"]

[[change]]
id = "p0r7-late-traces"
reason = "isolation snapshots each part as soon as its commands return and --report takes no snapshot, so a detached process the run started can write to the real pool after its part (canary isolation-lock-pool-worktree-after-part survived). Take a final snapshot in --report and compare it with the last part's after, and fail a part when a process with WT_VERIFY_SANDBOX=1 in its environment is still alive after it."
paths = ["xtask/src/isolation.rs", "xtask/src/report.rs", "xtask/src/parts.rs", "xtask/src/cmd.rs"]

[[change]]
id = "p0r7-oracle-should-fix"
status = "deferred: non blocking"
reason = "Oracle review round 7 should fix items: set GIT_CONFIG_GLOBAL and GIT_CONFIG_NOSYSTEM in Ctx::command; release check finds only literal hook names; the report never checks its parts' commit; listing rule path spelling versus real paths; unit layer real HOME and XDG. Code review round 7: build.rs non UTF 8 env panic and exported CARGO_FEATURE_ variables (builder side)."
paths = ["xtask/src/parts.rs", "xtask/tests/int.rs", "xtask/src/report.rs", "xtask/src/isolation.rs"]

[[change]]
id = "p0r8-file-length"
reason = "2026-10-24: a source file should be around 500 lines, 1000 lines is a hard cap. Split xtask/src/isolation.rs (1643 lines) and any other oracle file over 1000 lines into modules of about 500, with no behaviour change. The product files over the cap (crates/wt-core/tests/pool.rs, crates/wt/tests/cli.rs) go to the builder."
paths = ["xtask/src/isolation.rs", "xtask/src/isolation/"]

[[change]]
id = "p0r8-no-process-hunt"
reason = "Oracle review round 8 B1 (blocking): the lingering process check can kill the owner's Terminal shells in a run folder, because ps -x omits the root owned /usr/bin/login parent and a missing ancestor counts as the run's. verification.md revision 9: isolation__left_no_trace compares snapshots before and after each part and at --report, looks for no processes and kills none. Remove the lingering process detection and killing (xtask/src/isolation/processes.rs and its callers) and the WT_VERIFY_INVOCATION marker if nothing else needs it; keep the --report final snapshot."
paths = ["xtask/src/isolation/", "xtask/src/parts.rs", "xtask/src/report.rs", "xtask/src/cmd.rs"]

[[change]]
id = "p0r9-mutants"
reason = "verification.md revision 9, the simplified process (2026-10-24): add the mutants part and mutants__should_leave_no_survivor (cargo mutants --in-diff against spec-base over crates/, unit and int tests, verify/mutants-allowed.toml for reviewed exceptions). Hand-written canary rounds end."
paths = ["xtask/", "verify/"]

[[change]]
id = "p1-host-coverage"
reason = "Host builder, phase 1: vscode/test/support/v8-lcov.mjs turns the host layer's V8 data into lcov with every line of src/ at count 1, so cover cannot see an untested host line. Convert per file with real counts (for example v8-to-istanbul semantics with source maps), and show cover fails on an uncovered host line."
paths = ["vscode/test/support/", "vscode/test/host/", "vscode/test/render/", "xtask/src/"]

[[change]]
id = "p1-host-fault-order"
reason = "Host builder, phase 1: oversize_line, garbage_line and unknown_version need a paused view whose status has version 1 although the fault is the tab's first line, so alone they fail on the first attempt and pass only on Mocha's retry, from an earlier test's state. Make each check set up its own earlier document so it passes alone and in any order, and make a pass that needed a retry visible."
paths = ["vscode/test/host/", "vscode/test/fake-wt.mjs", "xtask/src/"]

[[change]]
id = "p1-gitignore-css"
reason = "Oracle fix author, phase 1: vscode/.gitignore ignores media/webview.js but not media/webview.css, which npm run build writes, so every build leaves an untracked file and marks the run commit dirty. Ignore it."
