[[change]]
id = "sec-cc-harness"
reason = "The cc layer runs Claude Code locked down. Each session's canUseTool allows only the calls of its script, each tool with its command or path, and denies any other with a message that names it; the scripted calls keep their hold, allow and deny as before. The contract turn runs in auto mode with no tools, as auto mode approves calls without canUseTool. Only an allowlist of variables reaches claude, its hooks and commands: PATH, HOME, TMPDIR, USER, LOGNAME, SHELL, LANG, LANGUAGE, LC_*, ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, CLAUDE_CODE_OAUTH_TOKEN, GIT_CONFIG_GLOBAL, GIT_CONFIG_NOSYSTEM and WTPOOL_* but WTPOOL_BIN, so no SSH agent, GitHub or cloud token or variable of the starting session; HOME stays the real one, as macOS finds the login keychain through it. DISABLE_AUTOUPDATER=1 keeps a session from replacing the installed claude, since the run's configuration folder lacks the owner's autoUpdates setting. The run's settings deny WebFetch and WebSearch, which Claude Code runs for some hosts without asking, and turn Claude Code's sandbox on: Bash writes only in the session's working directories, all in the run folder, and Claude Code's temporary folder, reaches no host but localhost, never runs unsandboxed, asks as it would unsandboxed, and a sandbox that cannot start stops the session. The sessions' XDG_DATA_HOME and XDG_CACHE_HOME, like XDG_STATE_HOME, name folders in <run>/cc/: Claude Code's start-up cleanup prunes the versions it finds unlocked, and with only the state folder in the run folder it pruned the owner's real versions folder while it saw none of the owner's locks. contract__should_run_in_the_sandbox also fails when the owner's Claude Code install changed during the run: an entry of its versions folder, by name and modification time, or the target of ~/.local/bin/claude; it reads no file's content. The harness supports the latest installed Claude Code alone: a --record run in which every cc check passes moves each other claude-<version> folder of the recordings into recordings-backup/ beside them, as <folder>.bak-<seconds since the epoch>, so the next freeze locks the new version's recordings only; xtask/src/layers/cc.rs tests it. verification.md says so under No side effects and Contract test."
[change.files]
