id = "eslint-p8"
reason = "vscode/eslint.config.mjs adds the rules of the Google TypeScript Style Guide that ESLint can check, each at zero findings on the extension's sources. For every linted file: eqeqeq with == null allowed, prefer-const, curly multi-line, as an if that fits on one line may elide its block, no-duplicate-imports with separate type imports allowed, and no-restricted-syntax entries for a top-level arrow function or function expression without a type annotation, a field typed | undefined, a #private member, a const enum and a loop body that is not a block, joined with the entries of the oracle's rulesOf(). For TypeScript files: array-type array-simple, consistent-type-assertions with as and no object literal assertions, consistent-type-definitions interface, consistent-type-imports, explicit-member-accessibility no-public, no-non-null-assertion and parameter-properties. Type-aware over the two tsconfig programs of src/: no-confusing-void-expression with the void operator allowed, no-floating-promises, no-misused-promises, only-throw-error, prefer-readonly and unbound-method. naming-convention, no-unnecessary-condition and switch-exhaustiveness-check stay off. The oracle's lint groups and the checks that run them are unchanged."
