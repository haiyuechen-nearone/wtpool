[[change]]
id = "flake-fixes"
reason = "Eight host and e2e checks wait for the state their next step needs instead of a fixed moment that passes under load; their assertions stay as they were. The Command Palette helper of the e2e layer opens the palette through the View menu's command from its second try on for every caller, flow__keyboard_only and the keyboard terminal step included, as a webview frame could hold the keyboard while the workbench's active element was its body, where the workbench dropped the palette's keys and the palette never opened. flow__narrow_scroll gives the page keyboard focus from the webview frame around it and waits until the workbench and that frame have the page's frame as their focused element, as document.hasFocus() of a window that is never active can stay false. messages__should_ignore_everything_outside_the_set and hidden_then_shown wait for a view of their own tab: the host scenario checks posted folder_missing and idle_pool earlier, so the first sent its messages before the tab had a document and every one was ignored, and the second wrote its control lines before the fake wtpool read them, which drops them. early_exit waits for the paused view of each exit, and oversize_line, garbage_line and unknown_version for the paused view of the fault, before moving the fake clock, as a restart set after the clock moved never came, and these restart checks give a restarted fake wtpool 10 s instead of 3 s to log its start and print a line, which takes seconds on a loaded machine. title__should_drop_the_count_when_a_wait_ends waits up to 10 s for the first document, as the fake may start later than 3 s after the tab opens."
