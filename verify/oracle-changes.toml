[[change]]
id = "live-labels"
reason = "Labels follow the session's title, and a build a session started keeps it working, as status-panel.md revision 18 says. H16: a session's label is its title, a title the user gave (the payload's session_title, or a custom-title entry of the transcript at transcript_path) before one the harness generated (an ai-title entry), and it follows each change; the hook reads only the transcript's new bytes, from the record's transcript_offset to the end, at most the last 1 MiB, again from the start when the file was cut or replaced, and parses only lines that hold a JSON string ending in -title; a subagent's label is the description of the Agent call that started it, tied by that call's PostToolUse tool_response.agentId, else agent_type. A1: while a build process (S4) descends from a session's harness process through the parents of the process table, a session that would show idle or quiet shows working, with the action build: and the name of the outermost such build; other children of the harness, builds of other processes and subagents never count; S4 reads each process's parent. New checks, each in the trace list: labels__should_follow_the_transcript_title (an ai-title, then a custom-title, a later ai-title that leaves the given title, a rename, a rewritten transcript, a title inside another entry ignored, and the label wt status shows) and labels__should_use_the_description_of_the_agent_call (the PostToolUse before and after SubagentStart) for H16; builds__should_keep_the_session_that_started_them_working (an idle session's background build in wt1 below its harness process shows as working with build: cargo-nextest, wt1 working, a build of another process in wt2 building, then idle once the build is gone) and builds__should_keep_no_session_working_through_other_children (a child of an MCP server, a build of another process) for A1. The fake process table of the hook checks names each process's parent (start_child); every process the other checks start stays a child of pid 1."
paths = ["docs/design/status-panel/status-panel.md", "verify/trace.toml", "xtask/tests/checks/hook_strings.rs", "xtask/tests/checks/mod.rs", "xtask/tests/checks/status_builds.rs", "xtask/tests/support/hook.rs"]

