[[change]]
id = "cli-invisible"
reason = "The CLI escapes the characters the extension escapes: every control (Cc) and format (Cf) character, U+2028, U+2029 and the whole tag block. The four int checks of xtask/tests/checks/cli_text.rs take that set from the Unicode tables of the Node on PATH instead of a hand-written list, and assert that stdout and stderr hold none of it raw but the line feed. The branch of the ls and bg checks also holds U+2028 and U+FFF9, which the old list left out. The slot_dir of the config check holds every character of the set but NUL and the line feed, and each code point just outside a run of it, and the check asserts that each character of the set shows as \\u{XXXX} and every other one as it is; on a failure it prints the format characters of that Node's Unicode version as a Rust table of inclusive ranges."
[change.files]
"xtask/tests/checks/cli_text.rs" = "14e1c937711415ef6d112aad323f758efad4792ee5cdbe30ecbb1d8020c9ce53"

