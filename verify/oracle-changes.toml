[[change]]
id = "quiet-windows"
reason = "No window of a run takes focus or input from the apps in use, as verification.md, Isolation, now says. On macOS Electron activates its app whenever a window shows (BrowserWindow.show calls activateIgnoringOtherApps:YES), and VS Code shows every window it opens and steals focus for a window a second instance asks for (app.focus with steal), so each VS Code of host and e2e came to the front and took the keyboard; LaunchServices' open -g keeps only the launch itself in the background. vscode/test/support/background.mjs starts each VS Code of host/run.mjs and of e2e/vscode.mjs launch, which scripts/demo.mjs also uses, paused with --inspect-brk on a free loopback port, makes it an app that is never active through app.setActivationPolicy('prohibited') once Node stops at its first line, and lets it run; a VS Code it cannot keep in the background is killed before its first window and the layer fails with a setup error. Its windows open behind the others; they paint and run timers at full rate, and the checks reach them through CDP and Electron's API as before. The menu fallback of the quick input sends the window the vscode:runAction message of the menu item's command (workbench.action.showCommands, workbench.action.quickOpen), since a click on the item acts only in the focused window and no window of the run has focus. A focus guard (xtask/src/layers/focus.rs) asks lsappinfo for the frontmost app every 250 ms while host or e2e runs, writes <layer>/front.txt, and adds the failing result <layer>:focus when that app is a process whose command line names the run folder; system.rs reads a process's command line through sysinfo. Outside macOS VS Code starts as before and there is no guard. What every check judges is unchanged."
paths = ["docs/design/status-panel/verification.md", "vscode/test/support/background.mjs", "vscode/test/e2e/vscode.mjs", "vscode/test/host/run.mjs", "xtask/src/layers.rs", "xtask/src/layers/e2e.rs", "xtask/src/layers/focus.rs", "xtask/src/system.rs"]

