[[change]]
id = "visual-round"
reason = "The visual audit of 2026-10-25 (status-panel.md revision 14, verification.md revision 16). NARROW: the view scrolls horizontally, so nothing is clipped at any window size. U1 drops the cut-with-ellipsis rule; columns take the width their content needs, the table (not the page) scrolls horizontally inside a narrower tab with the header and the detail strip in view, keyboard focus scrolls an action wholly and a row's start into view, no text is clipped or cut with an ellipsis anywhere, and a worktree tag shows whole inside its cell after the name; U3's waiting chip scrolls the first waiting row's start into view. LIGHT CONTRAST: U6 requires WCAG AA for all text in Dark Modern, Light Modern, High Contrast and High Contrast Light, on plain, hovered and selected rows, 3:1 for focus rings and chip and strip outlines, and names the tokens (attention list-warningForeground, active textLink-foreground, quiet descriptionForeground, problem list-errorForeground; list-activeSelectionForeground for quiet and muted text on selected rows). From the same audit and two later follow-ups: every focus ring fully visible (X14), action glyphs centred (U4), hover visible in every theme including high contrast, chips keep their shape, the detail strip stands out, and every activity icon shows at one size (the idle dot and unused ring were smaller) (U6), the tab shows the extension's own light and dark icon, also after a restore (X1; VS Code's generic page glyph showed); tests of the scrolled panel. New shot checks layout__should_clip_no_text, tags__should_show_whole_after_the_name, scroll__should_scroll_the_table_inside_the_tab and scroll__should_bring_focus_and_waits_into_view (U1, U3), focus__should_show_every_ring_whole_in_contrast (X14, U6), actions__should_centre_their_glyphs (U4), icons__should_share_one_size, contrast__should_meet_aa_in_every_theme, hover__should_show_in_every_theme, chips__should_keep_their_outline_in_every_theme and detail__should_stand_out_from_the_page (U6), the host check tab__should_show_the_extension_icon (X1, X2), and the e2e flow flow__narrow_scroll (phase 3, a new User flows row), all from phase 3. Changed with the new U1 and U6: the 600 px part of shot__should_render_every_theme no longer asks for an ellipsis, flow__narrow_window asks for the branch whole, a sideways scroll and each action reachable once scrolled into view, and the oracle's group tokens (legend__should_cover_every_activity_value, flow__theme_switch) follow U6."
paths = ["docs/design/status-panel/", "vscode/test/shot/", "vscode/test/support/", "vscode/test/e2e/flows-exclusive.spec.mjs", "vscode/test/host/tab.test.cjs", "verify/checks.toml", "verify/trace.toml"]

