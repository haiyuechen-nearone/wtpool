[[change]]
id = "task-end"
reason = "A background task ends through its session's list of work in flight. On the owner's machine a done subagent kept a task with ended null for over an hour and showed working, background: cargo xtask (A1). Claude Code 2.1.310 builds background_tasks for every Stop and SubagentStop from the session's one task registry (vPn(taskRegistry.all()), [] when nothing is in flight), lists only tasks whose status is running or pending, and drops a task once it ends; sandbox runs with haiku showed the same, and that the list is session wide: a SubagentStop lists the subagent itself and the main session's Stop lists a subagent's shell task. So neither a missing list nor a finished task still listed explains the stuck task: the last SubagentStop that reached its record must have listed it while it ran, and no later stop of that record came, while the session's own later stops no longer named it. H27: the list covers the whole session; an entry counts unless its status is a text other than running or pending; a Stop or SubagentStop ends each running task of its own record the list leaves out, as before, and each such task of the session's other records that name the same process (H19) when it started at least 60 s before the event, as a list made before a task started cannot name it; an end changes nothing else in another record; without the list nothing ends, as Claude Code always sends it. A task an older wtpool left running ends the same way at the session's next stop. New check hook__should_end_a_task_through_its_session (int, phase 3, in the trace list under H27): a subagent whose last SubagentStop listed its build shows working, background: cargo build, and the session's next Stop, in Claude Code 2.1.310's shape, ends that task, ends the session's own task it lists as completed, and keeps a task it lists as running."
paths = ["docs/design/status-panel/status-panel.md", "verify/trace.toml", "xtask/tests/checks/hook_tasks.rs"]

[[change]]
id = "bash-summary"
reason = "H14 of status-panel.md gains a sentence: a command substitution ($(…) or backquotes) or an arithmetic $((…)) stays inside its word and is never the program, and a simple command of VAR=value words only names no program, so the next command's program is the target. The hook split such words at their spaces, so D=$(ls -d ~/x | head -1); echo $D stored -d, and TOKEN=$(echo ghp_abc) gh auth login stored ghp_abc) in the record and showed it on the panel. bash-commands.toml gains 9 commands, read by summary__should_match_the_table and bash_paths__should_match_the_table: a command substitution in VAR=value before the program after ; (summary echo, its path word places the session in wt2), a secret in a command substitution and one in backquotes before the program (summary gh auth, both in no file the hook writes), a path in backquotes, a cd in a subshell (wt2, make), a cd in a command substitution with assignments only (wt3, an empty summary) and before ls of another worktree (no last cd, two matches, fg), an arithmetic expansion that is no path word, and a quoted parenthesis inside a quoted command substitution. Its header gains the readings behind them: a substitution's path words count, its cd targets among them, but its cd moves no shell, and a cd in a subshell is a cd of H9, as one after sh -c is. What the other checks judge is unchanged."
