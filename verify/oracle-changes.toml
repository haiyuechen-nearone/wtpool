[[change]]
id = "oracle-gate"
reason = "oracle_unchanged allowed a change through the first live entry whose paths named it or a folder above it, and counted as live every entry the freeze commit's ledger lacked, every entry in a history without that commit, such as a squashed copy; verify/accepted.txt took the last word of any line as an accepted id, so `reject x` accepted x, and an accepted entry widened to more paths needed no new acceptance. The 35 live entries after the phase 3 freeze covered 278 of the 287 locked paths and the lock itself, so almost any oracle edit passed, a new entry for a covered path was never consulted, and the canary edit-oracle-with-lock survived. The gate now reads the lock alone, with no git. freeze writes into verify/oracle.lock the id of every entry it holds (spent), with the ids spent before, and a seal, the SHA 256 of the rest of the lock; a lock whose seal does not match counts as a changed file. Each entry carries a files table that maps each path it changes, or file:key for an oracle key, to its hash after the change, or to missing for a deletion; an entry covers a path or key only while that hash is current, so a later edit needs an entry of its own. paths no longer covers anything: new entries leave it out, and the older entries keep it as their record. An accept line is `accept <id> <entry hash>`, the SHA 256 of the entry's content as JSON with sorted keys; a line for another content, or one without a hash, accepts nothing, and any line but that, a # comment or a blank fails the check. A change no live entry pins fails, and the message names the entries that pin an older hash or have no files table and ends with the files lines to paste; an entry not accepted at its content gives oracle_change, and the message ends with its accept line. freeze reads git status -z with the source of a rename or copy whole, where it cut 3 characters from it. A canary's Expect: line may name a needs you code, which the canary runner then counts as caught. New canaries: edit-oracle-past-its-pin (an edit past the hash an accepted entry pins), widen-accepted-entry (Expect: oracle_change) and accept-with-another-verb; edit-oracle-reusing-spent-id and stop-frozen-check-accepted pin and accept their entries in the new format, and edit-oracle-with-lock takes a lock hunk without context, as each freeze rewrites the lines around it. xtask/src/clone.rs splits into the scratch clone, whose struct Clone is renamed ScratchClone, clone/canaries.rs and clone/inventory.rs; xtask/src/oracle.rs gains oracle/changes.rs and oracle/judge.rs. The move to the gate: the lock gains, by hand and unsealed, spent with the id of every entry before this one, which predate files tables and pin nothing; this entry pins every oracle path and key that differs from the lock today, the changes those accepted entries made since the phase 3 freeze included, and the lock itself. The next freeze writes the lock from the tree, seals it and spends this entry as well. verification.md, Oracle files and Canaries, says so."
