[[change]]
id = "output-filter"
reason = "The output tail and Follow remove the 8-bit C1 controls, which the terminal of VS Code acts on as on their 7-bit forms, where an OSC 52 writes the clipboard: a control string opened by U+0090, U+0098, U+009D, U+009E or U+009F goes with its payload up to BEL, ST (U+009C or ESC \\) or the next ESC, and every other C1 control goes too, an 8-bit CSI with its parameters. Follow also removes every C0 control and DEL but tab, line feed and carriage return, so only text and 7-bit SGR colours reach the terminal, and its error line is plain text. Follow reads at most 1 MiB per 1 s tick: a gain the rest of a tick cannot take waits for the next tick, and a gain larger than a whole tick skips to the file's last 40 lines after one line that says so. R12, X10 and X19 of status-panel.md say exactly what passes. tail__should_update_a_growing_file_within_a_second also checks a line of C1 control strings and that no C1 control reaches the webview. follow__should_stream_the_file_into_a_terminal checks the exact text the terminal gets for the 7-bit forms, the C1 control strings and the C0 controls, and a burst larger than a tick, made one gain by a rename, which shows the note, the last 40 lines and the line after it."
