[[change]]
id = "no-side-effects"
reason = "A run leaves the owner's use of the Mac as it was, as verification.md, No side effects, now says. vscode/test/support/main-hooks.mjs holds what the stop before VS Code's first line (support/background.mjs) installs in each VS Code of host and e2e on macOS, beside the activation policy: every BrowserWindow is transparent from its creation and ignores the mouse, since macOS orders a window of an app that is never active just behind the frontmost window, above other apps' windows (its page stays visible, its timers and animation frames run and screenshots work); keepAtBack, which scripts/demo.mjs turns on, and WTPOOL_VERIFY_VISIBLE_WINDOWS=1 keep opaque windows at the back instead, as main's demo fix did; Electron's clipboard is an in-memory store private to that VS Code, so readClipboard and writeClipboard of e2e/vscode.mjs, which now fail as a setup error without it, never touch the system pasteboard, and withClipboard of e2e/flows.mjs no longer saves and restores the owner's text but fails as a setup error when the pasteboard's change count, read with osascript without its content, moved during the copy; app.addRecentDocument and clearRecentDocuments do nothing, so VS Code no longer clears and refills the macOS recent documents of the bundle the owner's VS Code shares, and powerSaveBlocker starts no blocker; a native dialog, an OS notification and shell.beep are refused and noted in <layer>/side-effects.txt, which adds the failing result <layer>:side_effects (layers/focus.rs). support/code.mjs turns every accessibility signal's sound off and their volume to 0. The cc runner keeps Claude Code's configuration in <run>/cc/claude-config through CLAUDE_CONFIG_DIR, with CLAUDE_SECURESTORAGE_CONFIG_DIR empty so the keychain entry of the owner's login is read, drops the variables of the session and editor that started the run (CLAUDECODE, CLAUDE_*, VSCODE_*, ELECTRON_*, __CFBundleIdentifier, but the login variables), sets ENABLE_CLAUDEAI_MCP_SERVERS=false so the claude.ai connectors of the owner's account do not load, deletes the folders its sessions leave in /tmp/claude-<uid>, and contract__should_run_in_the_sandbox also fails when its session left a file in ~/.claude/ or a project entry in ~/.claude.json; recordings gain a config header field, which the scrubber writes as /Users/verify/.claude, so locked recordings scrub as before. xtask/src/priority.rs starts every job of each part but bench, and the shared builds, under taskpolicy -c utility on macOS and nice -n 10 elsewhere; WTPOOL_VERIFY_PRIORITY=normal turns it off. What every check judges is unchanged."
