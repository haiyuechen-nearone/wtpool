[[change]]
id = "p2-b1-wait"
reason = "budget__b1 cannot pass: support::hook::wait_output sleeps 5 ms between try_wait calls, so every hook run measures above 5 ms and p95 <= 5 ms is out of reach (release wt hook measures p95 3.3 ms directly). Wait on the child instead of polling."
