[[change]]
id = "auto-gc"
reason = "The hook runs gc itself, so no cron or launchd job is needed, as status-panel.md H21 now says; on macOS such a job can also meet a privacy (TCC) prompt or denial for a repository under ~/Desktop or ~/Documents, and without one records piled up. After the end of a session (SessionEnd) has written its record, at most once a day per pool, the hook runs the gc of wtpool hook gc: wtpool-activity/gc.stamp holds the RFC 3339 time the pool's last gc began, and under the stamp's lock, which a hook never waits for, a hook that finds the stamp missing, unreadable, 24 hours or more before or any time after its clock writes its own time there, then runs gc. gc looks up only the processes the records name and skips a record whose lock another process holds; the hook's gc stops 200 ms after the hook began; a stopped gc removes the stamp, so the next session's end goes on. wtpool hook gc runs whatever the stamp says and stamps it too. The stamp is no record: wtpool status, the watcher and gc pass it by, and a symlink, FIFO or other file that is not regular in its place is replaced. New check, in the trace list for H21 and from phase 3: gc__should_run_once_a_day_on_session_end (int), a session's end without a stamp and one 2 days later each stamp the pool, a session's end with a stamp 6 days old deletes the ended and dead records over a week old, one with a stamp an hour old deletes nothing, and wtpool hook gc then runs on that fresh stamp and stamps its time. The session_end_cleanup scenario's files steps list gc.stamp after its SessionEnd and after its gc, as the hook now writes it there. watch__should_ignore_lock_and_temp_files also writes wtpool-activity/gc.stamp, and status__should_skip_fifos_symlinks_locks_and_large_records a record copy named gc.stamp, which neither may show. verification.md's What needs you no longer asks for a daily job. What the other checks judge is unchanged."
