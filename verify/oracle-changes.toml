ould_follow_the_end_unless_scrolled_up (render), output__should_clip_nothing_in_every_theme and output__should_show_the_follow_ring_whole (shot), flow__live_output (e2e). Two checks for X15 and U5, from phase 3: detail__should_update_while_open (render) and detail__should_post_each_document_while_open (host), the open detail strip showing each new document's facts, actors and Output section, updated in place so focus in it survives, which X15 now states; flow__live_output also checks in VS Code that the open strip follows a commit in wt2 and the agent's next call. The trace file test counts 110 IDs and gives H27, S13, R12, U9 and X19 phase 3. The approved shots are not re-locked."
