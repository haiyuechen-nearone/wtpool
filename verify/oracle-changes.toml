reason = "A design for approval; nothing is built and no check changes. docs/design/jobs/jobs.md is new: heavy jobs, a per-user machine-wide limit on heavy commands run as wtpool job -- <command>, where heavy is a list of command patterns kept per repository, suggested from the stack markers the repository holds (one data table in wtpool-core, and the scripts of package.json, read only and bounded) and heavy only once the user accepts them, plus a machine list that starts empty; the list drives the queue, build detection and a policy (off, warn by default, require) that flags heavy work outside a job and lets a harness adapter refuse it with the wrapped command. The panel's strip edits the limit, the policy and the patterns, and adds suggestions, through wtpool job limit, enforce and heavy add|rm [--repo] [--suggested], which edit machine.toml or the repository's wtpool.toml in place, keeping other keys and comments. It holds requirements, choices, the J rows J1 to J24, the heading's muted count of this repository's suggestions until its first pattern, user flows, failure modes, adoption with the planned plugin skill, privacy and security, a verification plan, open questions Q1 to Q18, all resolved, and a follow-up naming autodetect.md as planned. docs/design/jobs/attachments/ holds its mockups with their HTML sources, mockup.css and render.mjs, which renders them through vscode/src/webview/icons.css and style.css and the theme values of verify/themes/ in the Chromium of vscode/test's Playwright. status-panel.md gains the phase 4 rows H29, A8, S14, S15, W10, U10 to U15, X20, X21 and X22, and amends R7, H1 to H4 and H22 (a sync PreToolUse policy entry for shell calls, wtpool hook policy, the only hook command that prints), H14 (a summary skips wtpool job up to --), S4 and A1 (builds are processes matching a heavy pattern, or a suggestion while a repository has no list), the document's field list, U6, U8, X11 (the jobSettings message with pattern edits), X14, the legend, the Phases table (phase 4, planned) and the UI mockups table; docs/design/status-panel/attachments/ gains the SeveralAgents mockups of U12 and U13 with their sources. Every new ID is phase 4 and in no trace list, flow table or scenario catalog yet, so trace_complete, flows__should_each_have_an_e2e_check and catalog__should_match_the_files judge nothing new."
