[[change]]
id = "harness-layers"
reason = "The layers, the int part, the report and the standards copy, in leaf modules. layers.rs holds only its module declarations, re-exports, two limits and Wanted: the release wtpool, the npm installs, the web build and Chromium move to layers/builds.rs, the JavaScript layers with the quick and ui entry points to layers/js.rs, the manifest checks to layers/manifests.rs and the cc judges to layers/cc_judge.rs; web.rs splits into web/registry.rs and web/merge.rs, and web/files.rs is renamed web/reporters.rs. The int part runs as step functions over a pure TestEnv. junit::to_outcomes is the one converter of nextest reports, so the message of a failed Rust budget starts with its test's full name, as an int check's does. cc judges the live result in a pure judge_live with typed runner outcomes and kinds, and a --record run that cannot keep its live result for the lock reports the error cc:live_result instead of ignoring the write, and retires no recordings of other versions; the cc runner's limit is the layer limit, which the 3 h cap never lowered. The static checks tell setup problems from findings by enum Problem, with the same messages. The report lists each budget result under Budgets; its oracle diff lists the files oracle::is_oracle_path names and the files of oracle keys, so verify/reviews, verify/oracle-changes.toml and verify/accepted.txt leave that section; Verdict implements Display; report.rs splits into report/verdict.rs, report/markdown.rs and report/write.rs. trace_complete reads its problems as a struct and judges harness:self_test, harness:fmt, harness:clippy and harness:rustdoc, which verify/trace.toml and the harness checks paragraph of verification.md now list. verify/standards/google-rust-style-guide.md, the guide's own rustguide.md at google/styleguide 89e0e1b with a note naming its source and licence, replaces the HTML copy, and static:doc_links counts the HTML anchors the guide links to. The header of verify/themes/webview-default.css names src/vs, and a comment of vscode/test/e2e/vscode.mjs names the pool each attempt builds. Two test races end: two must_load cases shared one temporary file, and the machine lock tests failed while a process another test spawned still held a copy of the lock file."
