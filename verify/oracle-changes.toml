[[change]]
id = "fix-b4"
reason = "The bench pool gives its foreground a bench branch when the source's HEAD is detached, as in the frozen clone a full verify runs from, where the copy had no branch and every slot started with all its commits unreferenced, so B4 waited for counts that never came and timed out without a message. B4 counts each slot's unreferenced commits from the first document. B4's commits and record writes stop once their p95 can no longer pass (xtask/src/budget.rs, which now holds the nearest rank p95), so a blind or slow watcher fails with the samples it took and, for a commit no document showed, the count its last document gave, within the 120 s a bench check may take. The budgets also wait for every other verify part, of the same run or another: every part and a run's shared builds hold the machine-wide verify.lock in the harness cache shared, the bench part holds it alone while the budgets measure, and another verify part under way counts as load under the existing 10 minute machine_busy rule. verification.md revision 20 states these rules. The budgets, their limits and what they measure are unchanged."
