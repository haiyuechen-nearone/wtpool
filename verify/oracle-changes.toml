reason = "Checks for extension lines no oracle layer ran. The host window opens from a workspace file holding its one workspace folder, so a check can change the window's folders: VS Code restarts no extension host for that while it runs tests, and a window opened on a folder would enter a workspace, which stops the host of the checks. spawn__should_run_in_the_workspace_folder gains the case first_folder_changes (R9): a folder added after the first changes neither the watch nor the title; when another folder replaces the first, the old watch ends, the tab drops the old document, resets the title to Worktrees and starts a watch in the new folder; with no folder left the watch ends, the tab posts the no folder view and no wt starts; a folder that comes back gets a watch. stream__should_post_paused_before_the_first_document gains the case wt_error (R10), with the fake wt's new fault error_exit, which writes stderr and exits with a code: the paused view carries wt's last non-empty stderr line after more stderr than the stream keeps, then wt exited with code 1 for an exit without stderr, and the live view after a working start carries no error. chips__should_count_and_scroll_to_waiting gains the render case keyboard_focus_scrolls_rows_and_actions (U1, U3): Tab focus scrolls a row's start and a whole row action into view, and focus that a click gives scrolls nothing; the render support records each scroll's options."
