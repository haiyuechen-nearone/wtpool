[[change]]
id = "h22-stdout-json"
reason = "The live-hook finding of 2026-10-25: wt hook install printed its presence note on stdout after the block, so the output was no valid settings file and Claude Code skipped it without a word, and no hook ran live. The oracle took the first JSON object of stdout, so the trailing text passed. status-panel.md H22 (revision 13): stdout carries the block alone, as valid JSON, and the note goes to stderr. Add install__should_print_only_the_block_on_stdout (release wt, with and without the block in settings.json: stdout parses whole and equals the block of H1, stderr holds the note and no JSON), and make the cc sandbox parse stdout whole and fail otherwise."
