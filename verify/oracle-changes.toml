[[change]]
id = "generic-harness"
reason = "The harness runs the same way on every system, with no tool of one operating system, and assumes no particular user. machine_busy reads CPU use and processes through sysinfo 0.24.7, the version wt-core pins, instead of sysctl, ps and lsof: a budget waits while more than half the cores are busy over a 3 s sample (Windows has no load average) or a build runs outside the run folder, as before; where sysinfo gives no reading (on Windows sysinfo 0.24.7 does not build), the budgets run and each result says the load was not read, never skipping the wait in silence. The logging git of the int checks and their real build process are programs of xtask (src/bin, logging-git and sleeper) instead of a zsh script and a codesigned copy of sleep; the logged line, its start time and the process name are unchanged. A multi-part run wraps each part in the command prefix WT_VERIFY_WRAPPER when set, instead of a fixed path when it exists. freeze names the author from git config --global --includes without GIT_CONFIG_GLOBAL, so ~/.config/git/config and included files count. isolation__left_no_trace reads the real pool from WT_FOREGROUND only, with no default pool, and says why it skipped the pool rules. The cache and data folders follow XDG_CACHE_HOME and XDG_DATA_HOME, by default ~/.cache/wt-verify and ~/.local/share/wt-verify. The VS Code CLI is WT_VERIFY_VSCODE_CLI, else the platform's install location (Linux also code on PATH), else none. The tree copy of schema__generated_files_current starts with an empty target folder instead of a copy on write by macOS cp -c. The scrubber writes {tmp} for the system's temporary folder and {tmp}/claude for Claude Code's per account one, so the claude-2.1.306 fixtures are scrubbed again from the same locked recordings and the canary fixture-edited-by-hand follows. The canaries that no longer applied to the tree apply again with their intent: the product canaries follow the code into crates/wt/src/version.rs, edit-oracle-with-lock rewrites the hash at its current line, edit-oracle-under-round-2-entry weakens version__ in xtask/tests/int.rs, a file of the spent entry, since the rebuild steps moved out of xtask/src/parts.rs, and the oracle canaries carry context lines so they apply without --unidiff-zero. xtask and its int checks also build for Linux and Windows; a check that needs Unix permissions or exec stops at its setup elsewhere. The file snapshots of the int checks compare size, modification time, mode and inode as before."
paths = ["xtask/Cargo.toml", "xtask/Cargo.lock", "xtask/src/", "xtask/tests/", "verify/fixtures/claude-2.1.306/", "verify/canaries/phase-0/edit-oracle-reusing-spent-id.patch", "verify/canaries/phase-0/edit-oracle-under-round-2-entry.patch", "verify/canaries/phase-0/edit-oracle-with-lock.patch", "verify/canaries/phase-0/release-reads-verify-clock.patch", "verify/canaries/phase-0/stop-check-by-renaming-the-binary.patch", "verify/canaries/phase-0/stop-frozen-check-accepted.patch", "verify/canaries/phase-0/suppress-allow-attribute.patch", "verify/canaries/phase-0/suppress-in-target-module.patch", "verify/canaries/phase-0/version-release-drops-commit.patch", "verify/canaries/phase-0/version-release-never-dirty.patch", "verify/canaries/phase-2/fixture-edited-by-hand.patch"]

