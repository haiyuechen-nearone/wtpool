id = "comments-ts"
reason = "The static layer of the quick part gains static:ascii_bundles: every line of the built bundles, out/*.js and media/*.js, holds only ASCII characters, and a finding names the file, the line, the first other character as U+XXXX and its column. The coverage converter of render and host stops when a bundle's size in bytes differs from the length V8 measured in UTF-16 units, as a raw U+00B7 in a JSDoc that esbuild keeps once made it, so the check names the cause in the quick part instead. A unit test of the static layer covers an ASCII line, a U+00B7 and a character outside the BMP."
