[[change]]
id = "p2-cc-interrupt-allow"
reason = "cc_interrupt's settings did not allow {wt2}/.verify/block.sh, so Claude Code 2.1.306 sent a PermissionRequest before the interrupt; by H13 and A1 that wait never decays, so the session's wt assert (quiet after 125 s) contradicts the spec. The session means a plain interrupt: allow the script, re-record this one session live, and re-scrub its fixture."
paths = ["vscode/test/cc/", "verify/fixtures/", "xtask/src/"]

[[change]]
id = "p2-w4-quiet-window"
reason = "watch__should_refresh_git_after_an_edit_or_bash_call starts its quiet window when it reads the alive line, but its git-log follower stamps each git start up to 20 ms late, so a heartbeat's last git start can land inside the window (failed once with '1 starts'). Stamp starts from the log's own times, or allow the follower's lag as margin."
paths = ["xtask/tests/"]

[[change]]
id = "drop-mutants"
reason = "Revision 13 (2026-10-24): drop mutation testing entirely; unit, integration and e2e tests are the bar, aiming at 100 % line coverage. Phase 2 run 1's mutants part would have taken about 4 h (984 mutants at about 65 s each). Remove the mutants part, mutants__should_leave_no_survivor, its cargo shim and verify/mutants-allowed.toml handling; cover stays a Done condition at 100 % of changed lines."
