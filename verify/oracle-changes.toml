[[change]]
id = "hook-hardening"
reason = "wtpool hook reads no path whose start may reach another host: a path with a UNC, device or verbatim prefix other than a drive's, a root without a drive on Windows, or elsewhere one that starts with exactly two slashes lies outside every pool and is never stat'ed or resolved, the paths a .git file names included. A record that cannot fit in 16 KiB once the oldest ended ids, then the oldest calls in flight, are dropped is not written, so the record stays as it was, and the hook log says it skipped the event, as it does for a lock it cannot take. placement__should_use_the_nearest_existing_ancestor gains a UNC-shaped path to wt2 that leaves the actor in fg, and placement__should_read_the_path_field_of_each_tool gains UNC-shaped Read, Bash and CwdChanged cases that move nothing. The new check hook__should_keep_a_record_it_can_read brings a record within 150 bytes of 16 KiB through the cwd of its first event; a call past the limit is then dropped from in_flight alone, and a StopFailure whose record cannot fit leaves the record byte for byte as it was, readable by wtpool status, with a skip line in the hook log. verify/trace.toml and the H18 entry of the trace list in verification.md name it. The call input is read straight into the sorted text it hashes, with the same hash as before, and wait__should_hash_input_with_sorted_keys gains an input with every kind of JSON value. What the other checks judge is unchanged."
[change.files]
"docs/design/status-panel/verification.md" = "77851b397cfc67b4990954f10471df8019a3952775a9c21e3b1c7679fbc1c7f9"
