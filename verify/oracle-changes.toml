id = "predoc-header"
reason = "X6 gains the starting state. A new watch is starting until wtpool's first line, and the header shows it as \"starting…\" over the empty table: the webview writes that header before any view arrives, and the extension posts the starting view (connection starting, status null, no retry_at) as soon as a visible tab opens, so the header is never blank while wtpool computes its first document. A fault, or 30 s without a line, pauses a starting watch as before, and it never turns stale. Test interface 5 of verification.md lists starting among the connections. The webview's first script is now inline in the page, a second nonce script, so it listens before VS Code hands over the messages it queued; media/early.js is no longer built or packaged, and vscode/.gitignore no longer names it. render__should_escape_and_isolate_controls and restore__should_ignore_hostile_state look for inline scripts in the body, where the strings render, as the page's own inline script sits in head. The coverage converter skips the page URL, which that inline script carries in jsdom and which no file below vscode/ holds. stall_30s waits for the first document instead of the first view before it moves the clock, oversize_line, garbage_line and unknown_version count only views with a document when they look for a faulty one, and stream__should_accept_unknown_properties does not count the starting view as a pause. New checks, in the trace list for X6 and from phase 3: header__should_show_starting_before_the_first_line (render: the header reads starting… with the chips, wtpool's error and the rows hidden before any view, after a starting view and after 20 s of ticks, then live with the rows of the first document) and stream__should_post_starting_before_the_first_line (host: with a wtpool whose first line comes 5 s after it starts, the tab posts a starting view within 1 s of opening and no other view before the first document while the clock moves 20 s)."
