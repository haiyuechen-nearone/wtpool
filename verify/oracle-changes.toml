[[change]]
id = "cli-agent-guard"
reason = "X12 of status-panel.md gains the agent guard of the CLI itself: wtpool free and wtpool fg refuse while an actor works or waits in a worktree they would detach or repoint, the slot that free names and for fg the foreground and the slot that holds the branch, when wtpool status would show it there as working, waiting or quiet; idle and done never refuse. The refusal names the worktree, each such actor with its label and state, and --force, and exits 1 as the other refusals do; --force skips the guard, and every other output stays the same. The extension keeps its dialogs and refusals and runs wtpool free <worktree> --force or wtpool fg <branch> --force only after the user confirms, so actions.test.cjs expects --force at the end of the argv of every confirmed free and fg, and in the command its errors name. S12 gains a sentence: a new value in an existing closed enum (state, reason, kind, placed_by, activity) raises version, and harness adapters map onto these closed sets. Five int checks are new, in xtask/tests/checks/agent_guard.rs: free__should_name_an_agent_by_its_escaped_label_else_its_key (a label with C1 controls and a bidi override shows as \\u{XXXX} in the refusal, as in every error line of the CLI, and an empty label gives the key), free__should_refuse_while_an_agent_works_or_waits (working, waiting, quiet), fg__should_refuse_while_an_agent_works_or_waits (the holding slot and the foreground, each working and waiting), force__should_skip_the_agent_guard (free and fg past a working agent) and guard__should_never_refuse_for_idle_done_or_elsewhere_agents (idle, done, and a working agent in another worktree, for free and for fg). Each refusal case checks exit 1, an empty stdout, the worktree, label, state and --force on stderr, and that no worktree moved. verify/trace.toml names all five under X12; the trace list of verification.md is unchanged."
[change.files]
