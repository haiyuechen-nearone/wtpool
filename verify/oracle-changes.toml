[[change]]
id = "p2-realistic-load"
reason = "Revision 14 (2026-10-24): the load model is one wt instance on a machine with fewer than 10 worktrees. Phase 2 runs 2 and 3 failed watch checks and B4 because the oracle's own load backed up fseventsd. Size the stress to that load, keeping each check's meaning: H18 200 writers to 16, H24 32 writers x 20 rounds to 8 x 10, B9 20 worktrees to 10."
