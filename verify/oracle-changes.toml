[[change]]
id = "harness-runner"
reason = "The harness runner. Reuse hashes the VS Code that vscode/test runs: with WTPOOL_VERIFY_VSCODE set, the part hashes also hold its path and the version its own code command line reports, found where @vscode/test-electron's resolveCliPathFromVSCodeExecutablePath puts it, and that command line is the one hashed when WTPOOL_VERIFY_VSCODE_CLI is unset; a test pins the discovery order of support/vscode-app.mjs and the locked @vscode/test-electron version. The quick part gains harness:fmt, harness:clippy and harness:rustdoc: cargo fmt --check, clippy of all targets with -D warnings and rustdoc with -D warnings of xtask/, its own workspace, beside harness:self_test; for them priority.rs and xtask/tests/checks/hook_tasks.rs are formatted and a doc comment of catalog.rs is fixed. Their harness: prefix sends them to quick, as for harness:self_test, so neither verify/checks.toml nor the trace list names them. A part list refuses --only and passes --contract and --record on to the cc part; --contract without the cc part and --record without --contract are refused (enum Contract). A run refuses WTPOOL_VERIFY_RETRIES, WTPOOL_VERIFY_HOST_RETRIES, WTPOOL_VERIFY_HOST_ORDER and WTPOOL_VERIFY_HOST_INVERT unless unset or 0. The timeout of cmd::run also covers the readers of the command's output, so a process that keeps the pipes open past it is killed with the group; a part list waits for the parts of a wave it started when a later one fails to start. The int checks run at the normal priority once their binary is built at the lower one: the utility QoS clamp of macOS coalesces timers, which stretched the ten 10 ms sleeps of watch__should_merge_a_burst_into_one_document to over 340 ms against its 200 ms; verification.md, No side effects, says so. parts.rs splits into parts/ctx.rs (Ctx) and parts/quick.rs, Reused moves to results.rs, rebuild.rs names WtpoolPackage, and lib.rs gains a module map. What every check judges is unchanged."
