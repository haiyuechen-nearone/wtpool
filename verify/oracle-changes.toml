[[change]]
id = "forge-github"
reason = "The GitHub code of wtpool-core moves into a crate of its own, crates/wtpool-github, behind a Forge trait of wtpool-core, so the workspace members gain that crate; the binary wtpool gives its pool the GitHub adapter. One parser reads a remote's URL for both PR refs and the status document's repository.github: https://github.com/<owner>/<repo>, git@github.com:<owner>/<repo> and ssh://git@github.com/<owner>/<repo>, each with or without .git. A PR ref on a remote with any other URL, which the old PR parser took, such as a local path or file URL holding github.com, http://, a user other than git, credentials, a trailing slash, a subdomain or a host ending in github.com, now gets the warning that the remote is not on github.com and changes nothing. Every other output, git command line and exit code stays the same, and so does the document. Two int checks are new in xtask/tests/checks/bg_pr.rs. Each runs wtpool bg with PATH holding only a link to git and a fake gh that logs its arguments, so no real gh can run, and serves origin git@github.com:acme/app.git from the sandbox's bare origin through a fake ssh that refuses any other connection; the sandbox's origin URL is put back afterwards. bg__should_park_the_head_branch_of_the_pr_gh_names checks stderr, stdout, the branch, its upstream and gh's arguments for a PR of the same repository and one from a fork, each fetched new and each refreshed from a local branch with --refresh. bg__should_refuse_a_pr_without_a_head_to_use checks the warning, the line that no slot changed and exit status 1 for an origin under a github.com folder, no origin, a PR URL of another repository, a reference that names nothing, a head that is no branch name, gh exiting 4 or 2 silently, gh killed and a gh that cannot start, and whether gh was asked. What the other checks judge is unchanged."
[change.files]
