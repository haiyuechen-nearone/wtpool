[[change]]
id = "cli-presentation"
reason = "The terminal presentation of the CLI leaves wtpool-core: the worktree facts (Row, Role, State, Uncommitted, Upstream, Unreferenced, Operation) move to a domain module of wtpool-core, and the ls and setup table with its ANSI colours, column layout and shortening moves to the wtpool binary. The CLI also shows each control, bidi and zero width character of a branch, path or other string from git, a record or a setting as \\u{XXXX}, with the character set of X10, in every line it writes itself: the ls and setup table, each warning, progress line and error, the commit subject fg prints, the note of wtpool hook install and the text of wtpool config; JSON output, the output of git and on_new_slot that it passes on, and a path that fg, bg or path prints to a pipe stay as they are. Row R2 of status-panel.md says so. Every other byte of CLI output, wtpool status --json and the schema stay the same. Four int checks are new in xtask/tests/checks/cli_text.rs: wtpool ls with a branch that holds an OSC 52 sequence, a bidi override and a zero width space, and a gone worktree whose name holds a C1 control and a bidi override; the fetching line of wtpool bg for a branch only a local origin has; the commit subject wtpool fg prints; and a slot_dir that wtpool config prints. Each asserts the escapes and that stdout and stderr hold no raw character of the set but the line feed."
[change.files]
