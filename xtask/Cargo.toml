[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace, so the oracle's dependencies never enter the product's Cargo.lock.
[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde", "display"] }
jsonschema = { version = "=0.60.1", default-features = false }

# The machine_busy rule reads processes and CPU use through it (src/system.rs, its only user), the
# same on macOS, Linux and Windows; wtpool-core pins the same version and features.
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
rstest = { version = "=0.27.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
# Test names follow `<sut>__should_<assertion>`, which this lint rejects; attributes may not
# allow it (lint__no_suppressions), so the workspace does.
non_snake_case = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
