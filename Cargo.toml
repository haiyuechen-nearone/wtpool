[workspace]
resolver = "3"
members = [
    "crates/wtpool-core",
    "crates/wtpool-claude-code",
    "crates/wtpool-github",
    "crates/wtpool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/haiyuechen-nearone/wtpool"
homepage = "https://github.com/haiyuechen-nearone/wtpool"
readme = "README.md"
keywords = ["git", "worktree", "agents", "claude-code", "vscode"]
publish = false

[workspace.dependencies]
wtpool-core = { path = "crates/wtpool-core" }
wtpool-claude-code = { path = "crates/wtpool-claude-code" }
wtpool-github = { path = "crates/wtpool-github" }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "error-context"] }
terminal_size = "=0.4.4"
libc = "=0.2.190"
thiserror = "=2.0.21"
tempfile = "=3.27.0"
rstest = { version = "=0.27.0", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
signal-hook = { version = "=0.3.18", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
# Test names follow `<sut>__should_<assertion>`, which this lint rejects; attributes may not
# allow it (lint__no_suppressions), so the workspace does.
non_snake_case = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
