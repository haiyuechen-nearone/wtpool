name: Feature request
description: Suggest a change to what wtpool, its hook or the VS Code tab does.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The spec, docs/design/status-panel/status-panel.md, gives each behaviour an ID, such as H6 or A1. Name the ones your idea touches, if you know them.
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What wtpool should do
      description: The behaviour you suggest. Commands and sample output help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else you tried
      description: Workarounds, other tools, or other designs you considered.
