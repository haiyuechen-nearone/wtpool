[package]
name = "wtpool-core"
description = "The library behind wtpool: a pool of git worktrees, and the status of the coding agents that work in them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["development-tools"]
publish.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
serde_json = "=1.0.154"
# RFC 3339 times of the status document and the activity records.
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
# The process table of S4, H19 and H21 and the machine name: names, working folders, parents and
# start times of processes, on macOS, Linux and Windows, without unsafe.
sysinfo.workspace = true
# The folder watch of W2: FSEvents on macOS, without unsafe.
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
